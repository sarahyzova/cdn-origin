<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CDN Client</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --surface2: #252836;
      --border: #2e3147;
      --accent: #6c63ff;
      --accent-dim: #4a43cc;
      --success: #22c55e;
      --danger: #ef4444;
      --warning: #f59e0b;
      --text: #e2e8f0;
      --text-dim: #8892a4;
      --radius: 8px;
      --font: 'Segoe UI', system-ui, sans-serif;
      --mono: 'Cascadia Code', 'Fira Code', 'Consolas', monospace;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      font-size: 14px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── Top bar ── */
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 12px 20px;
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }

    header h1 {
      font-size: 16px;
      font-weight: 600;
      letter-spacing: .5px;
      color: var(--accent);
      white-space: nowrap;
    }

    .config-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      flex: 1;
      align-items: center;
    }

    .config-row label {
      color: var(--text-dim);
      font-size: 12px;
      white-space: nowrap;
    }

    .config-row input {
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: var(--radius);
      padding: 6px 10px;
      font-size: 13px;
      font-family: var(--mono);
      outline: none;
      transition: border-color .15s;
    }

    .config-row input:focus { border-color: var(--accent); }
    .config-row input.wide { width: 260px; }
    .config-row input.narrow { width: 90px; }
    .config-row input.token { width: 320px; }

    /* ── Layout ── */
    .layout {
      display: flex;
      flex: 1;
      overflow: hidden;
      min-height: 0;
    }

    /* ── Sidebar (buckets) ── */
    .sidebar {
      width: 260px;
      min-width: 200px;
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .sidebar-header {
      padding: 14px 16px 10px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .sidebar-header span {
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .8px;
      color: var(--text-dim);
    }

    .bucket-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
    }

    .bucket-item {
      padding: 9px 12px;
      border-radius: var(--radius);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      transition: background .1s;
    }

    .bucket-item:hover { background: var(--surface2); }
    .bucket-item.active { background: var(--accent); color: #fff; }
    .bucket-item.active .bucket-meta { color: #ffffffcc; }

    .bucket-name {
      font-family: var(--mono);
      font-size: 13px;
      font-weight: 500;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .bucket-meta {
      font-size: 11px;
      color: var(--text-dim);
      white-space: nowrap;
    }

    .bucket-del {
      background: none;
      border: none;
      color: var(--danger);
      cursor: pointer;
      padding: 2px 5px;
      border-radius: 4px;
      font-size: 14px;
      opacity: 0;
      transition: opacity .1s;
    }

    .bucket-item:hover .bucket-del { opacity: 1; }

    .sidebar-footer {
      padding: 12px;
      border-top: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .input-group {
      display: flex;
      gap: 6px;
    }

    .input-group input {
      flex: 1;
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: var(--radius);
      padding: 7px 10px;
      font-size: 13px;
      font-family: var(--mono);
      outline: none;
    }

    .input-group input:focus { border-color: var(--accent); }

    .select-sm {
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: var(--radius);
      padding: 7px 8px;
      font-size: 12px;
      outline: none;
      cursor: pointer;
    }

    /* ── Buttons ── */
    .btn {
      padding: 7px 14px;
      border: none;
      border-radius: var(--radius);
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      transition: opacity .15s, background .15s;
    }

    .btn:hover { opacity: .85; }
    .btn:active { opacity: .7; }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-danger { background: var(--danger); color: #fff; }
    .btn-ghost { background: var(--surface2); color: var(--text); border: 1px solid var(--border); }
    .btn-sm { padding: 5px 10px; font-size: 12px; }
    .btn-icon { padding: 5px 8px; }

    /* ── Main panel ── */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .main-header {
      padding: 14px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      background: var(--surface);
    }

    .main-header h2 {
      font-size: 14px;
      font-weight: 600;
      font-family: var(--mono);
    }

    .badge {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 99px;
      font-weight: 500;
    }

    .badge-public { background: #22c55e22; color: var(--success); border: 1px solid #22c55e44; }
    .badge-private { background: #ef444422; color: var(--danger); border: 1px solid #ef444444; }

    .spacer { flex: 1; }

    .path-bar {
      display: flex;
      align-items: center;
      gap: 4px;
      font-family: var(--mono);
      font-size: 12px;
      color: var(--text-dim);
      flex-wrap: wrap;
    }

    .path-seg {
      cursor: pointer;
      padding: 2px 4px;
      border-radius: 4px;
      color: var(--accent);
      transition: background .1s;
    }

    .path-seg:hover { background: var(--surface2); }

    .path-sep { color: var(--border); }

    /* ── Upload zone ── */
    .upload-zone {
      margin: 16px 20px;
      border: 2px dashed var(--border);
      border-radius: var(--radius);
      padding: 24px;
      text-align: center;
      color: var(--text-dim);
      font-size: 13px;
      transition: border-color .15s, background .15s;
      cursor: pointer;
      position: relative;
    }

    .upload-zone.drag { border-color: var(--accent); background: #6c63ff0d; color: var(--accent); }

    .upload-zone input[type=file] {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
    }

    .upload-zone .upload-hint { font-size: 12px; margin-top: 4px; }

    /* ── Path input ── */
    .upload-controls {
      padding: 0 20px 12px;
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }

    .upload-controls label { font-size: 12px; color: var(--text-dim); white-space: nowrap; }

    .upload-controls input {
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: var(--radius);
      padding: 6px 10px;
      font-size: 13px;
      font-family: var(--mono);
      outline: none;
      flex: 1;
      min-width: 140px;
    }

    .upload-controls input:focus { border-color: var(--accent); }

    /* ── File table ── */
    .file-section {
      flex: 1;
      overflow-y: auto;
      padding: 0 20px 20px;
    }

    .section-title {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .8px;
      color: var(--text-dim);
      padding: 12px 0 8px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    thead th {
      text-align: left;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .6px;
      color: var(--text-dim);
      padding: 6px 10px;
      border-bottom: 1px solid var(--border);
    }

    tbody tr {
      transition: background .1s;
      cursor: pointer;
    }

    tbody tr:hover { background: var(--surface2); }

    tbody td {
      padding: 9px 10px;
      border-bottom: 1px solid var(--border);
      font-size: 13px;
    }

    td.key {
      font-family: var(--mono);
      max-width: 300px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    td.size { color: var(--text-dim); white-space: nowrap; }
    td.mime { color: var(--text-dim); font-family: var(--mono); font-size: 12px; }
    td.actions { white-space: nowrap; text-align: right; }

    .act-btn {
      background: none;
      border: none;
      cursor: pointer;
      padding: 4px 7px;
      border-radius: 5px;
      font-size: 13px;
      transition: background .1s;
      color: var(--text-dim);
    }

    .act-btn:hover { background: var(--border); color: var(--text); }
    .act-btn.del:hover { background: #ef444422; color: var(--danger); }
    .act-btn.dl:hover { background: #22c55e22; color: var(--success); }

    /* ── Empty state ── */
    .empty {
      text-align: center;
      padding: 48px 20px;
      color: var(--text-dim);
    }

    .empty .icon { font-size: 36px; margin-bottom: 12px; }
    .empty p { font-size: 13px; }

    /* ── Toast ── */
    #toast-area {
      position: fixed;
      bottom: 20px;
      right: 20px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      z-index: 9999;
      pointer-events: none;
    }

    .toast {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 10px 16px;
      font-size: 13px;
      max-width: 320px;
      box-shadow: 0 4px 20px #0008;
      pointer-events: all;
      animation: slide-in .2s ease;
    }

    .toast.success { border-left: 3px solid var(--success); }
    .toast.error { border-left: 3px solid var(--danger); }
    .toast.info { border-left: 3px solid var(--accent); }

    @keyframes slide-in {
      from { transform: translateX(20px); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }

    /* ── Modal ── */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: #0009;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }

    .modal {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
      width: 440px;
      max-width: 95vw;
      box-shadow: 0 8px 40px #0008;
    }

    .modal h3 { font-size: 15px; margin-bottom: 16px; }

    .form-row {
      display: flex;
      flex-direction: column;
      gap: 5px;
      margin-bottom: 12px;
    }

    .form-row label { font-size: 12px; color: var(--text-dim); }

    .form-row input, .form-row select {
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: var(--radius);
      padding: 8px 11px;
      font-size: 13px;
      font-family: var(--mono);
      outline: none;
    }

    .form-row input:focus, .form-row select:focus { border-color: var(--accent); }

    .form-row select { cursor: pointer; }

    .modal-actions {
      display: flex;
      gap: 8px;
      justify-content: flex-end;
      margin-top: 16px;
    }

    /* ── Meta panel ── */
    .meta-grid {
      display: grid;
      grid-template-columns: max-content 1fr;
      gap: 6px 16px;
      font-size: 13px;
    }

    .meta-key { color: var(--text-dim); }

    .meta-val {
      font-family: var(--mono);
      font-size: 12px;
      word-break: break-all;
    }

    /* ── Progress bar ── */
    .progress-bar {
      height: 3px;
      background: var(--border);
      border-radius: 99px;
      overflow: hidden;
      margin-top: 8px;
    }

    .progress-fill {
      height: 100%;
      background: var(--accent);
      border-radius: 99px;
      transition: width .2s;
    }

    /* ── Scrollbar ── */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 99px; }

    .hidden { display: none !important; }

    .no-bucket-msg {
      display: flex;
      flex: 1;
      align-items: center;
      justify-content: center;
      color: var(--text-dim);
      font-size: 14px;
      flex-direction: column;
      gap: 10px;
    }

    .no-bucket-msg .icon { font-size: 40px; }
  </style>
</head>
<body>

<!-- ── Top Bar ── -->
<header>
  <h1>CDN Client</h1>
  <div class="config-row">
    <label>Host</label>
    <input id="cfg-host" class="wide" type="text" value="localhost" placeholder="localhost" title="Domain suffix (e.g. localhost or cdn.example.com)" />
    <label>Port</label>
    <input id="cfg-port" class="narrow" type="number" value="3030" placeholder="3030" />
    <label>HTTPS</label>
    <select id="cfg-https" class="select-sm">
      <option value="false">http</option>
      <option value="true">https</option>
    </select>
    <label>Token</label>
    <input id="cfg-token" class="token" type="password" placeholder="Bearer token (JWT_SECRET)" />
    <button class="btn btn-primary btn-sm" onclick="loadBuckets()">Connect</button>
  </div>
</header>

<!-- ── Layout ── -->
<div class="layout">

  <!-- ── Sidebar ── -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <span>Buckets</span>
      <button class="btn btn-ghost btn-sm btn-icon" onclick="loadBuckets()" title="Refresh">↻</button>
    </div>
    <div class="bucket-list" id="bucket-list">
      <div class="empty"><p>Click Connect to load buckets</p></div>
    </div>
    <div class="sidebar-footer">
      <div class="input-group">
        <input id="new-bucket-name" type="text" placeholder="bucket-name" maxlength="63" />
      </div>
      <div style="display:flex;gap:6px;align-items:center;">
        <select id="new-bucket-adapter" class="select-sm" style="flex:1">
          <option value="blob">blob</option>
          <option value="keypath">keypath</option>
        </select>
        <label style="font-size:12px;color:var(--text-dim)">Public</label>
        <input id="new-bucket-public" type="checkbox" style="width:14px;height:14px;cursor:pointer;" />
        <button class="btn btn-primary btn-sm" style="white-space:nowrap" onclick="createBucket()">+ Create</button>
      </div>
    </div>
  </aside>

  <!-- ── Main ── -->
  <main class="main" id="main-panel">
    <div class="no-bucket-msg">
      <div class="icon">🗄️</div>
      <span>Select a bucket to browse files</span>
    </div>
  </main>
</div>

<!-- ── Toast area ── -->
<div id="toast-area"></div>

<!-- ── Modal ── -->
<div id="modal" class="modal-overlay hidden">
  <div class="modal" id="modal-content"></div>
</div>

<script>
// ── Config ──────────────────────────────────────────────────────────────────
const cfg = () => ({
  host: document.getElementById('cfg-host').value.trim() || 'localhost',
  port: document.getElementById('cfg-port').value.trim() || '3030',
  https: document.getElementById('cfg-https').value === 'true',
  token: document.getElementById('cfg-token').value.trim(),
});

const proto = () => cfg().https ? 'https' : 'http';
const apiBase = () => `${proto()}://${cfg().host}:${cfg().port}`;
const bucketBase = (b) => `${proto()}://${b}.${cfg().host}:${cfg().port}`;

const headers = (extra = {}) => {
  const h = { ...extra };
  const t = cfg().token;
  if (t) h['Authorization'] = `Bearer ${t}`;
  return h;
};

// ── State ───────────────────────────────────────────────────────────────────
let currentBucket = null;
let currentPath = '';   // current directory prefix
let buckets = [];

// ── Toast ───────────────────────────────────────────────────────────────────
function toast(msg, type = 'info', ms = 3500) {
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  el.textContent = msg;
  document.getElementById('toast-area').appendChild(el);
  setTimeout(() => el.remove(), ms);
}

// ── Modal ───────────────────────────────────────────────────────────────────
function showModal(html) {
  document.getElementById('modal-content').innerHTML = html;
  document.getElementById('modal').classList.remove('hidden');
}

function closeModal() {
  document.getElementById('modal').classList.add('hidden');
}

document.getElementById('modal').addEventListener('click', e => {
  if (e.target === document.getElementById('modal')) closeModal();
});

// ── Fetch helpers ────────────────────────────────────────────────────────────
async function api(method, url, body, extraHeaders = {}) {
  const opts = { method, headers: headers(extraHeaders) };
  if (body !== undefined) opts.body = body;
  const res = await fetch(url, opts);
  return res;
}

async function apiJson(method, url, jsonBody) {
  const h = { 'Content-Type': 'application/json' };
  const res = await api(method, url, jsonBody ? JSON.stringify(jsonBody) : undefined, h);
  if (!res.ok) {
    const txt = await res.text().catch(() => res.statusText);
    throw new Error(`${res.status} – ${txt}`);
  }
  if (res.status === 204) return null;
  return res.json().catch(() => null);
}

// ── Bucket list ──────────────────────────────────────────────────────────────
async function loadBuckets() {
  const list = document.getElementById('bucket-list');
  list.innerHTML = '<div class="empty"><p>Loading…</p></div>';
  try {
    const res = await apiJson('GET', `${apiBase()}/buckets`);
    buckets = Array.isArray(res) ? res : [];
    renderBucketList();
    toast(`Loaded ${buckets.length} bucket(s)`, 'success');
  } catch (e) {
    list.innerHTML = `<div class="empty"><p style="color:var(--danger)">${e.message}</p></div>`;
    toast('Failed to load buckets: ' + e.message, 'error');
  }
}

function renderBucketList() {
  const list = document.getElementById('bucket-list');
  if (!buckets.length) {
    list.innerHTML = '<div class="empty"><p>No buckets yet</p></div>';
    return;
  }
  list.innerHTML = buckets.map(b => `
    <div class="bucket-item ${currentBucket?.name === b.name ? 'active' : ''}"
         onclick="selectBucket('${b.name}')">
      <div>
        <div class="bucket-name">${esc(b.name)}</div>
        <div class="bucket-meta">${b.public ? '🌐 public' : '🔒 private'} · ${b.adapter}</div>
      </div>
      <button class="bucket-del" onclick="deleteBucket(event, '${b.name}')" title="Delete bucket">✕</button>
    </div>
  `).join('');
}

async function createBucket() {
  const name = document.getElementById('new-bucket-name').value.trim();
  const adapter = document.getElementById('new-bucket-adapter').value;
  const isPublic = document.getElementById('new-bucket-public').checked;

  if (!name) { toast('Enter a bucket name', 'error'); return; }
  if (!/^[a-z0-9\-]{3,63}$/.test(name)) {
    toast('Name must be 3–63 chars, lowercase letters, numbers, hyphens only', 'error');
    return;
  }

  try {
    const b = await apiJson('POST', `${apiBase()}/buckets/${encodeURIComponent(name)}`, {
      adapter, owner: 'user', isPublic
    });
    toast(`Bucket "${name}" created`, 'success');
    document.getElementById('new-bucket-name').value = '';
    await loadBuckets();
    selectBucket(name);
  } catch (e) {
    toast('Create failed: ' + e.message, 'error');
  }
}

async function deleteBucket(e, name) {
  e.stopPropagation();
  if (!confirm(`Delete bucket "${name}" and ALL its files?`)) return;
  try {
    await apiJson('DELETE', `${apiBase()}/buckets/${encodeURIComponent(name)}`);
    toast(`Bucket "${name}" deleted`, 'success');
    if (currentBucket?.name === name) {
      currentBucket = null;
      renderMainEmpty();
    }
    await loadBuckets();
  } catch (e) {
    toast('Delete failed: ' + e.message, 'error');
  }
}

// ── Select bucket ────────────────────────────────────────────────────────────
function selectBucket(name) {
  currentBucket = buckets.find(b => b.name === name) || { name };
  currentPath = '';
  renderBucketList();
  renderMain();
}

// ── Main panel ───────────────────────────────────────────────────────────────
function renderMainEmpty() {
  document.getElementById('main-panel').innerHTML = `
    <div class="no-bucket-msg">
      <div class="icon">🗄️</div>
      <span>Select a bucket to browse files</span>
    </div>`;
}

function renderMain() {
  if (!currentBucket) { renderMainEmpty(); return; }

  const b = currentBucket;
  const isPublic = b.public;
  const badgeCls = isPublic ? 'badge-public' : 'badge-private';
  const badgeText = isPublic ? 'Public' : 'Private';

  document.getElementById('main-panel').innerHTML = `
    <div class="main-header">
      <h2 id="main-bucket-title">${esc(b.name)}</h2>
      <span class="badge ${badgeCls}">${badgeText}</span>
      <div class="path-bar" id="path-bar"></div>
      <div class="spacer"></div>
      <button class="btn btn-ghost btn-sm" onclick="loadFiles()">↻ Refresh</button>
    </div>

    <div class="upload-zone" id="upload-zone">
      <input type="file" id="file-input" multiple onchange="onFileInputChange()" />
      <div>Drag & drop files here or click to browse</div>
      <div class="upload-hint">Files will be uploaded to the current path prefix</div>
    </div>

    <div class="upload-controls">
      <label>Upload prefix:</label>
      <input id="upload-prefix" type="text" placeholder="path/to/folder/" value="${esc(currentPath)}" />
      <button class="btn btn-ghost btn-sm" onclick="showUrlModal()">🔗 Signed URL</button>
    </div>

    <div class="file-section">
      <div class="section-title">Files</div>
      <div id="file-table-wrap"><div class="empty"><p>Loading…</p></div></div>
    </div>`;

  setupDragDrop();
  renderPathBar();
  loadFiles();
}

function renderPathBar() {
  const bar = document.getElementById('path-bar');
  if (!bar) return;
  const parts = currentPath ? currentPath.split('/').filter(Boolean) : [];
  let html = `<span class="path-seg" onclick="navTo('')">root</span>`;
  let acc = '';
  for (const p of parts) {
    acc += p + '/';
    const accCopy = acc;
    html += `<span class="path-sep">/</span><span class="path-seg" onclick="navTo('${esc(accCopy)}')">${esc(p)}</span>`;
  }
  bar.innerHTML = html;
}

function navTo(prefix) {
  currentPath = prefix;
  document.getElementById('upload-prefix').value = prefix;
  renderPathBar();
  loadFiles();
}

// ── Load files ───────────────────────────────────────────────────────────────
async function loadFiles() {
  const wrap = document.getElementById('file-table-wrap');
  if (!wrap || !currentBucket) return;
  wrap.innerHTML = '<div class="empty"><p>Loading…</p></div>';

  try {
    const prefix = currentPath || '';
    const url = prefix
      ? `${bucketBase(currentBucket.name)}/~objects/${encodeFilePath(prefix)}`
      : `${bucketBase(currentBucket.name)}/~objects`;
    const res = await api('GET', url);

    if (!res.ok) {
      const txt = await res.text().catch(() => res.statusText);
      throw new Error(`${res.status} – ${txt}`);
    }

    const files = await res.json();
    renderFileTable(wrap, Array.isArray(files) ? files : []);
  } catch (e) {
    wrap.innerHTML = `<div class="empty"><p style="color:var(--danger)">${esc(e.message)}</p></div>`;
  }
}

function renderFileTable(wrap, files) {
  if (!files.length) {
    wrap.innerHTML = `<div class="empty"><div class="icon">📂</div><p>No files in this directory</p></div>`;
    return;
  }

  // Separate directories (sub-prefixes) from files
  const dirs = new Set();
  const fileRows = [];
  const prefix = currentPath;

  for (const f of files) {
    const rel = f.key.startsWith(prefix) ? f.key.slice(prefix.length) : f.key;
    const slashIdx = rel.indexOf('/');
    if (slashIdx !== -1 && slashIdx < rel.length - 1) {
      dirs.add(rel.slice(0, slashIdx + 1));
    } else {
      fileRows.push({ ...f, relKey: rel });
    }
  }

  let html = `<table>
    <thead><tr>
      <th>Key</th><th>Size</th><th>MIME</th><th>Visibility</th><th></th>
    </tr></thead><tbody>`;

  // Directories first
  for (const dir of [...dirs].sort()) {
    html += `<tr onclick="navTo('${esc(prefix + dir)}')">
      <td class="key">📁 ${esc(dir)}</td>
      <td class="size">—</td><td class="mime">—</td><td>—</td><td></td>
    </tr>`;
  }

  // Files
  for (const f of fileRows) {
    const pub = f.public ? '<span class="badge badge-public" style="font-size:10px">public</span>'
                         : '<span class="badge badge-private" style="font-size:10px">private</span>';
    html += `<tr onclick="openFile('${esc(f.key)}')" style="cursor:pointer">
      <td class="key" title="${esc(f.key)}">${esc(f.relKey || f.key)}</td>
      <td class="size">${formatSize(f.size)}</td>
      <td class="mime">${esc(f.mimeType || '')}</td>
      <td>${pub}</td>
      <td class="actions">
        <button class="act-btn dl" onclick="downloadFile(event,'${esc(f.key)}')" title="Download">⬇</button>
        <button class="act-btn" onclick="viewMeta(event,'${esc(f.key)}')" title="Metadata">ℹ</button>
        <button class="act-btn del" onclick="deleteFile(event,'${esc(f.key)}')" title="Delete">🗑</button>
      </td>
    </tr>`;
  }

  html += '</tbody></table>';
  wrap.innerHTML = html;
}

// ── Drag & drop ──────────────────────────────────────────────────────────────
function setupDragDrop() {
  const zone = document.getElementById('upload-zone');
  if (!zone) return;

  zone.addEventListener('dragover', e => { e.preventDefault(); zone.classList.add('drag'); });
  zone.addEventListener('dragleave', () => zone.classList.remove('drag'));
  zone.addEventListener('drop', e => {
    e.preventDefault();
    zone.classList.remove('drag');
    uploadFiles([...e.dataTransfer.files]);
  });
}

function onFileInputChange() {
  const inp = document.getElementById('file-input');
  if (inp && inp.files.length) uploadFiles([...inp.files]);
}

async function uploadFiles(files) {
  if (!currentBucket || !files.length) return;

  const prefix = document.getElementById('upload-prefix')?.value || currentPath;

  for (const file of files) {
    const key = prefix + file.name;
    const url = `${bucketBase(currentBucket.name)}/${encodeFilePath(key)}`;
    const h = { 'Content-Type': file.type || 'application/octet-stream' };

    try {
      toast(`Uploading ${file.name}…`, 'info', 60000);
      const res = await api('POST', url, file, h);
      if (!res.ok) {
        const t = await res.text().catch(() => res.statusText);
        throw new Error(`${res.status} – ${t}`);
      }
      toast(`✓ Uploaded ${file.name}`, 'success');
    } catch (e) {
      toast(`✗ ${file.name}: ${e.message}`, 'error', 5000);
    }
  }

  // Reset file input and reload
  const inp = document.getElementById('file-input');
  if (inp) inp.value = '';
  loadFiles();
}

// ── Download ─────────────────────────────────────────────────────────────────
async function signJwt(payload, secret) {
  const enc = new TextEncoder();
  const b64url = obj =>
    btoa(JSON.stringify(obj)).replace(/\+/g, '-').replace(/\//g, '_').replace(/=/g, '');
  const header = b64url({ alg: 'HS256', typ: 'JWT' });
  const body   = b64url(payload);
  const key = await crypto.subtle.importKey(
    'raw', enc.encode(secret),
    { name: 'HMAC', hash: 'SHA-256' }, false, ['sign']
  );
  const sig = await crypto.subtle.sign('HMAC', key, enc.encode(`${header}.${body}`));
  const sigB64 = btoa(String.fromCharCode(...new Uint8Array(sig)))
    .replace(/\+/g, '-').replace(/\//g, '_').replace(/=/g, '');
  return `${header}.${body}.${sigB64}`;
}

async function openFile(key) {
  if (!currentBucket) return;
  const base = `${bucketBase(currentBucket.name)}/${encodeFilePath(key)}`;
  const secret = cfg().token;
  if (secret) {
    const exp = Math.floor(Date.now() / 1000) + 3600;
    const token = await signJwt({ action: 'read', bucket: currentBucket.name, key, exp }, secret);
    window.open(`${base}?signature=${encodeURIComponent(token)}`, '_blank');
  } else {
    window.open(base, '_blank');
  }
}

async function downloadFile(e, key) {
  e.stopPropagation();
  if (!currentBucket) return;
  const base = `${bucketBase(currentBucket.name)}/${encodeFilePath(key)}`;
  const secret = cfg().token;
  try {
    let url = base;
    if (secret) {
      const exp = Math.floor(Date.now() / 1000) + 3600;
      const token = await signJwt({ action: 'read', bucket: currentBucket.name, key, exp }, secret);
      url = `${base}?signature=${encodeURIComponent(token)}`;
    }
    const res = await fetch(url);
    if (!res.ok) throw new Error(`${res.status} – ${res.statusText}`);
    const blob = await res.blob();
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = key.split('/').pop();
    a.click();
    URL.revokeObjectURL(a.href);
  } catch (e) {
    toast('Download failed: ' + e.message, 'error');
  }
}

// ── Delete file ───────────────────────────────────────────────────────────────
async function deleteFile(e, key) {
  e.stopPropagation();
  if (!currentBucket) return;
  if (!confirm(`Delete file "${key}"?`)) return;
  const url = `${bucketBase(currentBucket.name)}/${encodeFilePath(key)}`;
  try {
    const res = await api('DELETE', url);
    if (!res.ok) throw new Error(`${res.status} – ${res.statusText}`);
    toast(`Deleted ${key}`, 'success');
    loadFiles();
  } catch (e) {
    toast('Delete failed: ' + e.message, 'error');
  }
}

// ── File metadata ─────────────────────────────────────────────────────────────
async function viewMeta(e, key) {
  e.stopPropagation();
  if (!currentBucket) return;
  const url = `${bucketBase(currentBucket.name)}/~meta/${encodeFilePath(key)}`;
  showModal('<h3>Loading metadata…</h3>');
  try {
    const res = await api('GET', url);
    if (!res.ok) throw new Error(`${res.status} – ${res.statusText}`);
    const meta = await res.json();

    const fileUrl = `${bucketBase(currentBucket.name)}/${encodeFilePath(key)}`;

    showModal(`
      <h3>File Metadata</h3>
      <div class="meta-grid" style="margin-bottom:16px">
        <span class="meta-key">Key</span>      <span class="meta-val">${esc(meta.key || key)}</span>
        <span class="meta-key">MIME</span>     <span class="meta-val">${esc(meta.mimeType || '—')}</span>
        <span class="meta-key">Size</span>     <span class="meta-val">${formatSize(meta.size)}</span>
        <span class="meta-key">Public</span>   <span class="meta-val">${meta.public ? 'Yes' : 'No'}</span>
        <span class="meta-key">Bucket</span>   <span class="meta-val">${esc(meta.bucketName || currentBucket.name)}</span>
        <span class="meta-key">ID</span>       <span class="meta-val">${esc(meta.id || '—')}</span>
        <span class="meta-key">Created</span>  <span class="meta-val">${meta.createdAt ? new Date(meta.createdAt).toLocaleString() : '—'}</span>
        <span class="meta-key">Updated</span>  <span class="meta-val">${meta.updatedAt ? new Date(meta.updatedAt).toLocaleString() : '—'}</span>
        <span class="meta-key">URL</span>      <span class="meta-val"><a href="${esc(fileUrl)}" target="_blank" style="color:var(--accent)">${esc(fileUrl)}</a></span>
      </div>
      <div class="modal-actions">
        <button class="btn btn-ghost" onclick="closeModal()">Close</button>
        <button class="btn btn-primary" onclick="downloadFile(event,'${esc(key)}');closeModal()">Download</button>
      </div>
    `);
  } catch (err) {
    showModal(`<h3>Error</h3><p style="color:var(--danger);margin-bottom:16px">${esc(err.message)}</p>
      <div class="modal-actions"><button class="btn btn-ghost" onclick="closeModal()">Close</button></div>`);
  }
}

// ── Signed URL modal ──────────────────────────────────────────────────────────
function showUrlModal() {
  if (!currentBucket) return;
  showModal(`
    <h3>Generate Signed URL</h3>
    <div class="form-row">
      <label>File key</label>
      <input id="sig-key" type="text" placeholder="path/to/file.ext" />
    </div>
    <div class="form-row">
      <label>Action</label>
      <select id="sig-action">
        <option value="read">read</option>
        <option value="write">write</option>
      </select>
    </div>
    <p style="font-size:12px;color:var(--text-dim);margin-top:4px">
      Signed URLs are generated server-side. Use your backend or the CDN's signing API.
    </p>
    <div style="margin-top:14px">
      <label style="font-size:12px;color:var(--text-dim)">Resulting URL format:</label>
      <div id="sig-preview" style="font-family:var(--mono);font-size:11px;word-break:break-all;margin-top:6px;padding:8px;background:var(--surface2);border-radius:6px;color:var(--text-dim)">
        Fill in the key above to preview
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal()">Close</button>
      <button class="btn btn-primary" onclick="copySigUrl()">Copy URL</button>
    </div>
  `);

  document.getElementById('sig-key').addEventListener('input', updateSigPreview);
  document.getElementById('sig-action').addEventListener('change', updateSigPreview);
}

function updateSigPreview() {
  const key = document.getElementById('sig-key').value.trim();
  const preview = document.getElementById('sig-preview');
  if (!key || !currentBucket) { preview.textContent = 'Fill in the key above to preview'; return; }
  const base = `${bucketBase(currentBucket.name)}/${encodeFilePath(key)}`;
  preview.textContent = `${base}?signature=<YOUR_JWT_TOKEN>`;
}

function copySigUrl() {
  const key = document.getElementById('sig-key').value.trim();
  if (!key) { toast('Enter a file key', 'error'); return; }
  const base = `${bucketBase(currentBucket.name)}/${encodeFilePath(key)}`;
  const url = `${base}?signature=<YOUR_JWT_TOKEN>`;
  navigator.clipboard.writeText(url).then(() => {
    toast('URL template copied to clipboard', 'success');
    closeModal();
  });
}

// ── Utilities ────────────────────────────────────────────────────────────────
function esc(s) {
  return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function encodeFilePath(key) {
  return key.split('/').map(s => encodeURIComponent(s)).join('/');
}

function formatSize(bytes) {
  if (bytes == null) return '—';
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' KB';
  if (bytes < 1073741824) return (bytes / 1048576).toFixed(1) + ' MB';
  return (bytes / 1073741824).toFixed(2) + ' GB';
}
